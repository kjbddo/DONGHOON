spring:
  application:
    name: algoforge-backend
  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/algoforge}
    username: ${DB_USERNAME:algoforge}
    password: ${DB_PASSWORD:algoforge}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # backend는 judge.result 큐만 소비하므로 auto ack + 재시도로 충분.
        # (실제 무거운 채점 작업과 manual ack는 judge-worker 모듈에서 처리)
        acknowledge-mode: auto
        prefetch: 4
        retry:
          enabled: true
          max-attempts: 3

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized

# ===== springdoc / Swagger UI =====
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true
  default-produces-media-type: application/json
  show-actuator: false

logging:
  level:
    root: INFO
    com.algoforge: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n'

# ===== Application 커스텀 설정 =====
algoforge:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_DEV_ONLY_PLEASE_USE_A_LONG_RANDOM_SECRET_AT_LEAST_64_BYTES}
    access-token-validity-seconds: 1800        # 30분
    refresh-token-validity-seconds: 1209600    # 14일
  ai:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    internal-token: ${INTERNAL_AI_TOKEN:1q2w3e$R1q2w3e$R1q2w3e$R1q2w3e$R}
    timeout-seconds: 60
    quota:
      daily-per-user: ${AI_QUOTA_DAILY_PER_USER:30}   # 사용자 1인 일일 한도 (0 이하 = 비활성)
      daily-global: ${AI_QUOTA_DAILY_GLOBAL:1000}     # 전체 일일 한도 (비용 보호)
  judge:
    submission-queue: judge.submission
    result-queue: judge.result
    dlx-exchange: judge.dlx
  cors:
    allowed-origins:
      - http://localhost:5173
  problem:
    import:
      # LICENSED_IMPORT 시 출처 URL 도메인 제한(비어 있으면 licenseAck·URL은 선택, 도메인 검사 생략)
      licensed-allowed-hosts: []
  seed:
    admin:
      enabled: ${ADMIN_INIT_ENABLED:true}
      email: ${ADMIN_INIT_EMAIL:admin@algoforge.local}
      username: ${ADMIN_INIT_USERNAME:admin}
      password: ${ADMIN_INIT_PASSWORD:admin1234}

# ===== Resilience4j (AI 서버 호출 보호) =====
resilience4j:
  circuitbreaker:
    instances:
      aiServer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50          # 50% 실패 시 OPEN
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - org.springframework.web.reactive.function.client.WebClientRequestException
  timelimiter:
    instances:
      aiServer:
        timeout-duration: 60s
        cancel-running-future: true
  retry:
    instances:
      aiServer:
        max-attempts: 2
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
