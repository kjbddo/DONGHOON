# ----------------------------------------------------------------------------
# AlgoForge Nginx 설정 샘플 (Ubuntu 22.04)
# /etc/nginx/sites-available/algoforge.conf 로 복사 후 sites-enabled에 심볼릭 링크
# ----------------------------------------------------------------------------

upstream algoforge_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name algoforge.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name algoforge.example.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/algoforge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algoforge.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- Security Headers ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5m;

    # --- React 정적 파일 ---
    root /srv/algoforge/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # --- API ---
    location /api/ {
        proxy_pass http://algoforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- SSE (채점 결과 스트림) - buffering off ---
    location ~ ^/api/submissions/[^/]+/stream$ {
        proxy_pass http://algoforge_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    # --- AI 서버는 외부 노출 금지 ---
    location /ai/ {
        return 404;
    }
}
